<title>BulSU E-Handbook</title>
<style>
:root{--bg:#f3f6f1;--card:#14532d;--card2:#0b3a1e;--gold:#e8b923;--ink:#f6f3e6;--soft:#b9d3c0;--page:#e7ede4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0e1a12}}
:root[data-theme="dark"]{--page:#0e1a12}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--page);display:grid;place-items:center;font-family:Georgia,'Times New Roman',serif;padding:16px}
a.card{display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,4vw,40px);align-items:center;width:min(100%,760px);aspect-ratio:1200/630;min-height:220px;padding:clamp(18px,5vw,56px);border-radius:18px;text-decoration:none;color:var(--ink);background:radial-gradient(circle at 15% 50%,#1d6b3b 0,var(--card) 45%,var(--card2) 100%);border:3px solid var(--gold);position:relative;overflow:hidden;transition:transform .2s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);outline:3px solid #fff;outline-offset:3px}
a.card::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border:18px solid rgba(232,185,35,.15);border-radius:50%}
.seal{width:clamp(90px,26vw,220px);height:auto;border-radius:50%;background:#fff;padding:4px;box-shadow:0 0 0 4px var(--gold)}
h1{margin:0 0 .3em;font-size:clamp(1.6rem,6vw,3.2rem);line-height:1.05}
p{margin:0;color:var(--soft);font-size:clamp(.85rem,2.4vw,1.2rem);font-family:system-ui,sans-serif}
.btn{display:inline-block;margin-top:1.1em;padding:.55em 1.2em;background:var(--gold);color:#0b3a1e;border-radius:999px;font:600 clamp(.8rem,2.2vw,1rem) system-ui,sans-serif}
</style></head><body>
